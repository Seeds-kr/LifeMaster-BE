spring.application.name=LifeMaster-BE
spring.docker.compose.file=C:/Users/parkerpark/Desktop/LifeMaster-BE/LifeMaster-BE/compose.yaml
spring.datasource.url=jdbc:mysql://localhost:3307/LifeMaster_db
spring.datasource.username=root
spring.datasource.password=1234

server.address=0.0.0.0
server.port=8080
#DB ??? ??
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.thymeleaf.enabled=true

# AWS S3
cloud.aws.s3.bucket=lifemaster
cloud.aws.stack.auto=false
cloud.aws.region.static=ap-northeast-2
cloud.aws.credentials.access-key=none
cloud.aws.credentials.secret-key=none/56XYpe9C

# OAuth2 Google ??
spring.security.oauth2.client.registration.google.client-id=none
spring.security.oauth2.client.registration.google.client-secret=none
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/googleLogin/callback
spring.security.oauth2.client.registration.google.scope=openid, profile, email

# OAuth2 Naver
spring.security.oauth2.client.registration.naver.client-id=none
spring.security.oauth2.client.registration.naver.client-secret=none
spring.security.oauth2.client.registration.naver.scope=name,email,profile
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:8080/naverLogin/callback
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

#mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-email-password
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# JWT KAKAO
jwt.kakao.secretKey=none
jwt.kakao.tokenValidityInMilliseconds=3600000
jwt.kakao.refreshTokenValidityInMilliseconds = 604800000
jwt.kakao.redirectUri = "http://localhost:8080/kakao/redirect"




