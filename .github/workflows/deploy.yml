name: Deploy to Server

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Pin server host key
        run: |
          echo "121.160.114.96 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICUVqx5lrfmPTbdloDU2Bmi/R+Jl8fXAsSxbzDtSor8m" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -n \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/id_ed25519 \
              harvester@121.160.114.96
